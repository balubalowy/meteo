name: Pobieranie Danych IMGW do Firebase

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  fetch-imgw:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch IMGW data and push to Firebase
        env:
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
        run: python .github/scripts/fetch_imgw_firebase.py

      - name: Generate and upload Map Data
        env:
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
        run: python .github/scripts/generate_map_data_firebase.py
