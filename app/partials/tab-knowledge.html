<div x-data="knowledgeBase" x-init="init()" style="width: 100%;">
        <h2 class="section-title"><i data-lucide="book-open" style="margin-right: 10px;"></i> Baza wiedzy</h2>
        
        <div style="display: flex; gap: 20px; flex-wrap: wrap;">
          
          <!-- Sidebar -->
          <div style="flex: 0 0 250px; display: flex; flex-direction: column; gap: 10px;">
            <input type="text" class="form-input" placeholder="Szukaj zjawiska..." x-model="searchQuery" style="margin-bottom: 10px;">
            
            <button class="btn" 
                    :class="activeCategory?.id === 'classifier' ? 'btn-primary' : 'btn-ghost'" 
                    style="text-align: left; padding: 10px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--border-subtle); margin-bottom: 15px; border-color: var(--accent-primary);"
                    @click="selectCategory({id: 'classifier', name: 'Klasyfikator chmur'})">
              <i data-lucide="camera" style="width: 16px; height: 16px;"></i>
              <span style="font-weight: bold; color: var(--accent-primary);">Klasyfikator chmur</span>
            </button>
            
            <template x-for="cat in categories" :key="cat.id">
              <button class="btn" 
                      :class="activeCategory?.id === cat.id ? 'btn-primary' : 'btn-ghost'" 
                      style="text-align: left; padding: 10px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--border-subtle);"
                      @click="selectCategory(cat)">
                <i :data-lucide="cat.icon" style="width: 16px; height: 16px;"></i>
                <span x-text="cat.name"></span>
              </button>
            </template>
          </div>

          <!-- Main Content -->
          <div style="flex: 1; min-width: 300px;">
            <template x-if="activeCategory">
              <div>
                <h3 style="color: var(--accent-primary); border-bottom: 1px solid var(--border-subtle); padding-bottom: 0.5rem; margin-bottom: 1.5rem;" x-text="activeCategory.name"></h3>
                
                <template x-if="filteredItems.length === 0">
                  <p style="color: var(--text-secondary);">Nie znaleziono wyników dla wyszukiwania.</p>
                </template>

                <div style="display: grid; grid-template-columns: 1fr; gap: 20px;">
                  <template x-for="item in filteredItems" :key="item.name">
                    <div class="card" style="padding: 1.5rem; display: flex; flex-direction: column; gap: 15px;">
                      <h4 style="font-size: 1.2rem; margin: 0; color: var(--text-primary);" x-text="item.name"></h4>
                      
                      <div style="background: var(--bg-tertiary); padding: 10px; border-radius: 8px; display: flex; align-items: center; gap: 10px; color: var(--accent-warning);">
                        <i data-lucide="alert-triangle" style="width: 18px; height: 18px;"></i>
                        <span style="font-size: 0.9rem;"><strong>Zagrożenie:</strong> <span x-text="item.danger"></span></span>
                      </div>
                      
                      <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                        <img :src="item.image" alt="Ilustracja" class="zoomable" loading="lazy" decoding="async" style="width: 100%; max-width: 300px; height: auto; border-radius: 8px; object-fit: cover; border: 1px solid var(--border-subtle);" onerror="this.src='data:image/svg+xml,<svg xmlns=\\\'http://www.w3.org/2000/svg\\\' width=\\\'300\\\' height=\\\'200\\\'><rect width=\\\'100%\\\' height=\\\'100%\\\' fill=\\\'#1e293b\\\'/><text x=\\\'50%\\\' y=\\\'50%\\\' fill=\\\'#64748b\\\' text-anchor=\\\'middle\\\' alignment-baseline=\\\'middle\\\'>Brak Obrazu</text></svg>'">
                        <div style="flex: 1; min-width: 250px; line-height: 1.6; color: var(--text-secondary);">
                          <p x-text="item.desc" style="margin-bottom: 10px;"></p>
                          <template x-if="item.url">
                            <a :href="item.url" target="_blank" style="color: var(--accent-primary); text-decoration: underline; font-weight: bold; display: flex; align-items: center; gap: 5px;">
                                <i data-lucide="external-link" style="width: 16px; height: 16px;"></i> Przejdź do strony
                            </a>
                          </template>
                        </div>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </template>
            
            <template x-if="activeCategory && activeCategory.id === 'classifier'">
              <div x-data="cloudClassifier">
                <h3 style="color: var(--accent-primary); border-bottom: 1px solid var(--border-subtle); padding-bottom: 0.5rem; margin-bottom: 1.5rem;">Klasyfikator Chmur (Identyfikacja)</h3>
                <p style="color: var(--text-secondary); margin-bottom: 20px; line-height: 1.6;">Wybierz to, co widzisz na niebie. Klasyfikator bazuje na oficjalnej tabeli WMO, filtrując niemożliwe kombinacje gatunków, odmian i form specjalnych.</p>
                
                <div class="card" style="padding: 2rem; display: flex; flex-direction: column; gap: 20px; background: var(--bg-tertiary);">
                  
                  <div>
                    <label style="display: block; margin-bottom: 5px; color: var(--text-secondary);">1. Rodzaj (Genus):</label>
                    <select class="form-input" x-model="rodzaj" @change="zmianaRodzaju()">
                      <option value="Brak">-- Wybierz Rodzaj --</option>
                      <option value="Cirrus">Cirrus</option>
                      <option value="Cirrocumulus">Cirrocumulus</option>
                      <option value="Cirrostratus">Cirrostratus</option>
                      <option value="Altocumulus">Altocumulus</option>
                      <option value="Altostratus">Altostratus</option>
                      <option value="Stratocumulus">Stratocumulus</option>
                      <option value="Stratus">Stratus</option>
                      <option value="Cumulus">Cumulus</option>
                      <option value="Nimbostratus">Nimbostratus</option>
                      <option value="Cumulonimbus">Cumulonimbus</option>
                    </select>
                  </div>
                  
                  <div x-show="rodzaj !== 'Brak'">
                    <label style="display: block; margin-bottom: 5px; color: var(--text-secondary);">2. Gatunek (Species):</label>
                    <select class="form-input" x-model="gatunek">
                      <template x-for="g in dostepneGatunki" :key="g">
                        <option :value="g" x-text="g"></option>
                      </template>
                    </select>
                  </div>
                  
                  <div x-show="rodzaj !== 'Brak'">
                    <label style="display: block; margin-bottom: 5px; color: var(--text-secondary);">3. Odmiana (Variety):</label>
                    <select class="form-input" x-model="odmiana">
                      <template x-for="o in dostepneOdmiany" :key="o">
                        <option :value="o" x-text="o"></option>
                      </template>
                    </select>
                  </div>
                  
                  <div x-show="rodzaj !== 'Brak'">
                    <label style="display: block; margin-bottom: 5px; color: var(--text-secondary);">4. Forma specjalna (Feature):</label>
                    <select class="form-input" x-model="forma">
                      <template x-for="f in dostepneFormy" :key="f">
                        <option :value="f" x-text="f"></option>
                      </template>
                    </select>
                  </div>
                  
                  <!-- Karta Prognostyczna na Żywo -->
                  <div x-show="rodzaj !== 'Brak' && forecastInfo" class="card" style="padding: 1.25rem; background: var(--bg-secondary); border-left: 4px solid var(--accent-primary); display: flex; flex-direction: column; gap: 10px;">
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 8px;">
                      <div>
                        <h4 style="margin: 0; font-size: 1.15rem; color: var(--text-primary); font-family: monospace;" x-text="fullCloudName"></h4>
                        <div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 2px;">
                          <span x-text="forecastInfo?.level"></span> • <span x-text="forecastInfo?.composition"></span>
                        </div>
                      </div>
                      <div :style="`background: rgba(255,255,255,0.06); padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; border: 1px solid ${forecastInfo?.threat_color}; color: ${forecastInfo?.threat_color};`">
                        Zagrożenie: <span x-text="forecastInfo?.threat"></span>
                      </div>
                    </div>

                    <div style="background: var(--bg-tertiary); padding: 12px; border-radius: 8px; font-size: 0.88rem; line-height: 1.55; color: var(--text-secondary); border: 1px solid var(--border-subtle);">
                      <strong style="color: var(--text-primary); display: flex; align-items: center; gap: 6px; margin-bottom: 4px;">
                        <i data-lucide="compass" style="width: 15px; height: 15px; color: var(--accent-primary);"></i> Czego się spodziewać (Prognostyka):
                      </strong>
                      <span x-text="forecastInfo?.forecast"></span>
                    </div>

                    <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px;">
                      <template x-if="forecastInfo?.wmo_url">
                        <a :href="forecastInfo?.wmo_url" target="_blank" class="btn btn-ghost" style="font-size: 0.8rem; padding: 6px 12px; border: 1px solid var(--border-subtle); color: var(--accent-primary); display: flex; align-items: center; gap: 6px; text-decoration: none;">
                          <i data-lucide="book-open" style="width: 14px; height: 14px;"></i> WMO Cloud Atlas
                        </a>
                      </template>
                      <button class="btn btn-primary" style="font-size: 0.8rem; padding: 6px 12px; display: flex; align-items: center; gap: 6px;" @click="szukajWGoogle()">
                        <i data-lucide="search" style="width: 14px; height: 14px;"></i> Zdjęcia (Google)
                      </button>
                    </div>
                  </div>
                  
                </div>
              </div>
            </template>
          </div>

        </div>
      </div>
