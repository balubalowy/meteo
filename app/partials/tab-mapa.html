<div style="height: 85vh; width: 100%; display: flex; flex-direction: column; position: relative;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; padding: 0 1rem;">
        <h2 style="margin: 0; display: flex; align-items: center; gap: 10px;">
            <i data-lucide="map" style="color: var(--accent-primary);"></i> Interaktywny Radar Premium
        </h2>
        <div style="display: flex; gap: 10px; align-items: center; background: var(--bg-secondary); padding: 5px 15px; border-radius: 20px; border: 1px solid var(--border-subtle);">
            <button id="rv-play-btn" class="btn btn-ghost" style="padding: 5px; border-radius: 50%; color: var(--accent-primary);">
                <i data-lucide="play"></i>
            </button>
            <span id="rv-time" style="font-family: monospace; font-size: 0.9rem; font-weight: bold; width: 60px; text-align: center;">--:--</span>
            <input type="range" id="rv-slider" min="0" max="10" value="10" style="width: 150px; accent-color: var(--accent-primary);">
        </div>
    </div>
    <div id="premium-map" style="flex: 1; border-radius: var(--radius-md); border: 1px solid var(--border-subtle); background: #111;"></div>
</div>

<style>
    .leaflet-control-layers-expanded { background: var(--bg-primary) !important; color: var(--text-primary) !important; border: 1px solid var(--border-subtle) !important; border-radius: 8px !important; }
</style>

<script>
    // Inicjalizacja odbywa się gdy Alpine (lub dynamic-tab) ładuje ten partial
    setTimeout(() => {
        // Zabezpieczenie przed podwójną inicjalizacją
        if (window.premiumMap) {
            window.premiumMap.remove();
        }

        const map = L.map('premium-map', {
            center: [51.9194, 19.1451], // Polska
            zoom: 6,
            zoomControl: false // dodamy w innym miejscu
        });
        window.premiumMap = map;

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Mapy bazowe
        const darkMap = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 20
        });

        const osmMap = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        });

        darkMap.addTo(map);

        // RainViewer Logic
        let radarLayers = [];
        let timestamps = [];
        let currentFrame = 0;
        let animationTimer = null;

        fetch('https://api.rainviewer.com/public/weather-maps.json')
            .then(res => res.json())
            .then(data => {
                timestamps = data.radar.past.map(t => t.time).concat(data.radar.nowcast.map(t => t.time));
                
                document.getElementById('rv-slider').max = timestamps.length - 1;
                document.getElementById('rv-slider').value = timestamps.length - 1;

                timestamps.forEach((time, index) => {
                    const layer = L.tileLayer(`https://tilecache.rainviewer.com/v2/radar/${time}/256/{z}/{x}/{y}/2/1_1.png`, {
                        opacity: index === timestamps.length - 1 ? 0.7 : 0,
                        zIndex: 10
                    }).addTo(map);
                    radarLayers.push(layer);
                });

                updateTimeDisplay(timestamps.length - 1);
            });

        function updateTimeDisplay(index) {
            if(!timestamps[index]) return;
            const date = new Date(timestamps[index] * 1000);
            document.getElementById('rv-time').textContent = date.toLocaleTimeString('pl-PL', {hour: '2-digit', minute:'2-digit'});
        }

        function showFrame(index) {
            radarLayers.forEach((layer, i) => {
                layer.setOpacity(i === parseInt(index) ? 0.7 : 0);
            });
            updateTimeDisplay(index);
        }

        document.getElementById('rv-slider').addEventListener('input', (e) => {
            currentFrame = parseInt(e.target.value);
            showFrame(currentFrame);
        });

        document.getElementById('rv-play-btn').addEventListener('click', (e) => {
            const btn = e.currentTarget;
            if (animationTimer) {
                clearInterval(animationTimer);
                animationTimer = null;
                btn.innerHTML = '<i data-lucide="play"></i>';
                lucide.createIcons();
            } else {
                btn.innerHTML = '<i data-lucide="pause"></i>';
                lucide.createIcons();
                if(currentFrame >= radarLayers.length - 1) currentFrame = 0;
                
                animationTimer = setInterval(() => {
                    currentFrame++;
                    if (currentFrame >= radarLayers.length) {
                        currentFrame = 0;
                    }
                    document.getElementById('rv-slider').value = currentFrame;
                    showFrame(currentFrame);
                }, 500); // 500ms na klatkę
            }
        });

        // Kontrolki warstw
        const baseMaps = {
            "Ciemna (CartoDB)": darkMap,
            "Jasna (OSM)": osmMap
        };

        // Zastępcze warstwy sat/wyładowań (Można rozszerzyć wg potrzeb usera)
        const dummyLightning = L.layerGroup(); 
        
        const overlayMaps = {
            "Radar opadów (Animowany)": L.layerGroup(), // To jest sterowane manualnie z slidera, dodane tu jako placeholder by było widoczne
            "Wyładowania (Wkrótce)": dummyLightning
        };

        L.control.layers(baseMaps, overlayMaps, { position: 'topright' }).addTo(map);

        // Przeładuj ikony lucide w nowym widoku
        lucide.createIcons();
        
        // Zmusić mapę do przerysowania (fix błędu szarych kafli Leaflet w zakładkach)
        setTimeout(() => map.invalidateSize(), 500);
    }, 200);
</script>
