<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard IMGW - Ekstrema Historyczne (Firebase)</title>
    <link rel="stylesheet" href="../assets/css/bcore.css">
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { margin: 0; padding: 0; overflow-x: hidden; }
        .map-container { width: 100%; height: calc(100vh - 120px); position: relative; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border-subtle); transition: height 0.3s ease; }
        .map-container.full-height { height: 100vh !important; border-radius: 0; border: none; }
        #plot { width: 100%; height: 100%; background: var(--bg-primary); }
        
        .sliders-container { position: absolute; bottom: 20px; left: 20px; background: rgba(24, 24, 27, 0.9); backdrop-filter: blur(8px); padding: 12px 15px; border-radius: 8px; z-index: 1000; border: 1px solid var(--border-subtle); display: flex; flex-direction: column; gap: 8px; width: 280px; transition: all 0.3s ease; }
        .sliders-container.collapsed .slider-row, .sliders-container.collapsed small { display: none !important; }
        .slider-row { display: flex; flex-direction: column; }
        .slider-row label { font-size: 11px; margin-bottom: 4px; display: flex; justify-content: space-between; color: var(--text-primary); }
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 14px; width: 14px; border-radius: 50%; background: var(--accent-primary); cursor: pointer; margin-top: -5px; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: var(--border-strong); border-radius: 2px; }
        
        #floating-show-topbar { position: absolute; top: 12px; left: 12px; z-index: 1001; display: none; background: rgba(24, 24, 27, 0.9); backdrop-filter: blur(8px); border: 1px solid var(--border-subtle); color: var(--text-primary); padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; font-weight: 500; }
        
        #loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-primary); z-index: 2000; display: flex; justify-content: center; align-items: center; color: white; font-size: 1.5rem; flex-direction: column; }
        .spinner { border: 4px solid var(--border-subtle); width: 40px; height: 40px; border-radius: 50%; border-left-color: var(--accent-primary); animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div>Pobieranie danych z Firebase (chmura)...</div>
    </div>

    <div id="top-panel-wrapper">
      <header class="topbar" style="margin-bottom: 8px; padding: 8px 16px;">
          <div class="logo">
              <i data-lucide="thermometer" class="symbol"></i>
              <div>
                  <h1 style="font-size: 1.1rem; margin: 0;">Baza Danych IMGW - <span style="font-size: 0.9rem; opacity: 0.8;">Pełna Historia (Live)</span></h1>
                  <div style="font-size: 0.75rem; color: var(--text-secondary);">Czas wygenerowania w chmurze: <b id="ui-time">---</b> | Przeanalizowano <span id="ui-count">0</span> snapshotów | Łączenie z Firebase...</div>
              </div>
          </div>
          <div class="top-stats">
              <button onclick="toggleTopbar()" class="btn btn-ghost" style="padding: 4px 10px; font-size: 0.8rem; border: 1px solid var(--border-subtle); display: flex; align-items: center; gap: 6px;" title="Schowaj panel sterowania, aby rozwinąć mapę na cały ekran">
                  <i data-lucide="eye-off" style="width: 14px; height: 14px;"></i> Schowaj Opcje
              </button>
          </div>
      </header>
      
      <div class="controls" style="display: flex; gap: 12px; margin-bottom: 8px; padding: 0 16px; flex-wrap: wrap; align-items: center;">
              <div class="control-group">
                  <label style="font-size: 0.75rem;">Parametr</label>
                  <select id="sel-zmienna" onchange="updateMap()" style="padding: 4px 8px; font-size: 0.85rem;">
                      <option value="temp">Temperatura</option>
                      <option value="grunt">Temperatura Gruntu</option>
                      <option value="wiatr">Poryw Wiatru</option>
                      <option value="wiatr_sr">Średnia Prędkość Wiatru</option>
                      <option value="wilg">Wilgotność</option>
                      <option value="rosy">Punkt Rosy</option>
                      <option value="synop">Model Synoptyczny (Wszystko)</option>
                  </select>
              </div>
              <div class="control-group">
                  <label style="font-size: 0.75rem;">Horyzont Czasowy</label>
                  <select id="sel-czas" onchange="updateMap()" style="padding: 4px 8px; font-size: 0.85rem;">
                      <option value="now">Aktualnie</option>
                      <option value="max3">Maksima - Ostatnie 3h</option>
                      <option value="min3">Minima - Ostatnie 3h</option>
                      <option value="max6">Maksima - Ostatnie 6h</option>
                      <option value="min6">Minima - Ostatnie 6h</option>
                      <option value="max12">Maksima - Ostatnie 12h</option>
                      <option value="min12">Minima - Ostatnie 12h</option>
                      <option value="max24">Maksima - Ostatnie 24h</option>
                      <option value="min24">Minima - Ostatnie 24h</option>
                  </select>
              </div>
              <div class="control-group checkbox-group">
                  <label style="font-size: 0.75rem;">Warstwy Mapy</label>
                  <div class="checkbox-row" style="font-size: 0.8rem; gap: 8px;">
                      <label><input type="checkbox" id="chk-inter" onchange="updateMap()" checked> Interpolacja</label>
                      <label><input type="checkbox" id="chk-iso" onchange="updateMap()" checked> Izolinie</label>
                      <label><input type="checkbox" id="chk-pt" onchange="updateMap()"> Punkty</label>
                      <label><input type="checkbox" id="chk-txt" onchange="updateMap()"> Wartości</label>
                      <label><input type="checkbox" id="chk-cbar" onchange="updateMap()" checked> Skala Kolorów</label>
                  </div>
              </div>
              <div class="control-group">
                  <label style="font-size: 0.75rem;">Podkład Mapy</label>
                  <select id="sel-style" onchange="updateStyle()" style="padding: 4px 8px; font-size: 0.85rem;">
                      <option value="carto-darkmatter">Dark Mode (Czytelny)</option>
                      <option value="carto-positron">Light Mode (Miasta pod spodem)</option>
                      <option value="open-street-map">OSM (Szczegółowy)</option>
                  </select>
              </div>
              
              <div class="stats" style="margin-left: auto;">
                  <div class="stat-box" style="font-size: 0.8rem;">Stacje (dane): <span class="val" id="st-dane">0</span></div>
                  <div class="stat-box" style="font-size: 0.8rem;">Zakres: <span class="val" id="st-zakres">0 - 0</span></div>
              </div>
      </div>
    </div>
    
    <div id="main-map-container" class="map-container">
        <button id="floating-show-topbar" onclick="toggleTopbar()"><i data-lucide="eye" style="width: 14px; height: 14px; vertical-align: middle;"></i> Pokaż Opcje</button>
        <div id="plot"></div>
        <div id="sliders-panel" class="sliders-container">
            <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; font-weight: 600; cursor: pointer; color: var(--text-primary);" onclick="toggleSliders()">
                <span style="display: flex; align-items: center; gap: 6px;"><i data-lucide="sliders" style="width: 14px; height: 14px;"></i> Wygląd i Przezroczystość</span>
                <span id="sliders-toggle-icon" style="font-size: 0.75rem; color: var(--accent-primary);">▲</span>
            </div>
            <div class="slider-row">
                <label><span>Przezrocz. Tła (Interpolacji):</span> <span id="val-op-gr">70%</span></label>
                <input type="range" id="sld-op-gr" min="0" max="10" value="7" oninput="updateSliders()">
            </div>
            <div class="slider-row">
                <label><span>Przezrocz. Punktów (Stacji):</span> <span id="val-op-pt">100%</span></label>
                <input type="range" id="sld-op-pt" min="0" max="10" value="10" oninput="updateSliders()">
            </div>
            <div class="slider-row">
                <label><span>Rozmiar Tła (Interpolacji):</span> <span id="val-sz-gr">15</span></label>
                <input type="range" id="sld-sz-gr" min="5" max="50" value="15" oninput="updateSliders()">
                <small style="color:var(--text-subtle); font-size:10px; margin-top:2px;">Zwiększ na przybliżeniu mapy, aby załatać dziury w siatce.</small>
            </div>
            <div class="slider-row">
                <label><span>Rozmiar Punktów (Stacji):</span> <span id="val-sz-pt">16</span></label>
                <input type="range" id="sld-sz-pt" min="4" max="40" value="16" oninput="updateSliders()">
            </div>
        </div>
    </div>

    <script type="module">
        import { firebaseConfig } from '../assets/js/firebase-config.js';

        let MAP_DATA = null;
        let ZMIENNE = null;
        let COLORS = null;
        let mapInitialized = false;

        async function loadData() {
            try {
                // Bezpośrednie zapytanie REST do Realtime Database aby oszczędzić wagi SDK
                const dbUrl = firebaseConfig.databaseURL;
                const response = await fetch(`${dbUrl}/imgw_map_data.json`);
                if(!response.ok) throw new Error("Network response was not ok");
                
                const data = await response.json();
                if(!data || !data.MAP_DATA) {
                    alert("Brak danych w bazie Firebase! Poczekaj na pierwsze wykonanie skryptu w tle.");
                    document.getElementById('loading').innerHTML = "Brak danych w Firebase. Sprawdź GitHub Actions.";
                    return;
                }

                MAP_DATA = data.MAP_DATA;
                ZMIENNE = data.ZMIENNE;
                COLORS = data.COLORS;

                document.getElementById('ui-time').innerText = data.LATEST_TIME || "Brak";
                document.getElementById('ui-count').innerText = data.SNAPSHOT_COUNT || "0";
                
                document.getElementById('loading').style.display = 'none';
                initMap();

            } catch(e) {
                console.error(e);
                alert("Błąd pobierania danych: " + e.message);
                document.getElementById('loading').innerHTML = "Błąd pobierania danych. Upewnij się, że wpisałeś poprawny URL Firebase.";
            }
        }

        function initMap() {
            if(mapInitialized) return;

            const traces = [
                // 0: Grid (Interpolacja)
                { type: 'scattermapbox', mode: 'markers', lat: [], lon: [], hoverinfo: "skip", marker: {size: 15, showscale: true} },
                // 1: Izolinie (Kontury)
                { type: 'scattermapbox', mode: 'lines', lat: [], lon: [], hoverinfo: "skip", line: {width: 1, color: 'rgba(0,0,0,0.4)'} },
                // 2: Punkty OK (Główna warstwa stacji)
                { type: 'scattermapbox', mode: 'markers', lat: [], lon: [], text: [], hoverinfo: "text", textfont: {size: 11, color: "black"}, textposition: "middle center", marker: {size: 16, showscale: false} },
                // 3: Punkty Brak Danych
                { type: 'scattermapbox', mode: 'markers', lat: [], lon: [], text: [], hoverinfo: "skip", marker: {size: 4, color: 'rgba(255,255,255,0.0)'} },
                // 4: Strzałki Wiatru (Globalna Siatka wektorowa)
                { type: 'scattermapbox', mode: 'text', lat: [], lon: [], text: [], hoverinfo: "skip", textfont: {size: 14, color: "rgba(0,0,0,0.7)"}, textposition: "middle center" },
                // 5: Etykiety (Top Left) Synop - Temp
                { type: 'scattermapbox', mode: 'text', lat: [], lon: [], text: [], hoverinfo: "text", textfont: {size: 12, color: "#990000"}, textposition: "top left" },
                // 6: Etykiety (Bottom Left) Synop - Rosy
                { type: 'scattermapbox', mode: 'text', lat: [], lon: [], text: [], hoverinfo: "text", textfont: {size: 12, color: "#006600"}, textposition: "bottom left" },
                // 7: Etykiety (Top Right) Synop - Wiatr Śr
                { type: 'scattermapbox', mode: 'text', lat: [], lon: [], text: [], hoverinfo: "text", textfont: {size: 12, color: "#000099"}, textposition: "top right" },
                // 8: Etykiety (Bottom Right) Synop - Wiatr Poryw
                { type: 'scattermapbox', mode: 'text', lat: [], lon: [], text: [], hoverinfo: "text", textfont: {size: 12, color: "#660066"}, textposition: "bottom right" }
            ];

            const layout = {
                margin: {l: 0, r: 0, t: 0, b: 0},
                showlegend: false,
                mapbox: { style: "carto-darkmatter", center: {lat: 52.0, lon: 19.2}, zoom: 5.5 }
            };
            
            Plotly.newPlot('plot', traces, layout, {responsive: true});
            mapInitialized = true;
            window.updateMap();
        }

        window.updateMap = function() {
            if(!MAP_DATA) return;
            const z_key = document.getElementById("sel-zmienna").value;
            const okres = document.getElementById("sel-czas").value;
            
            const d = MAP_DATA[z_key][okres];
            const zi = ZMIENNE[z_key];
            const cscale = COLORS[zi.cscale];
            
            let lbls = [], lbls_tl = [], lbls_tr = [], lbls_bl = [], lbls_br = [];
            const is_synop = (z_key === 'synop');
            
            if (is_synop) {
                lbls_tl = d.pt_txts.map(t => (t.split('|')[0] !== "None" ? t.split('|')[0] : ""));
                lbls_tr = d.pt_txts.map(t => (t.split('|')[1] !== "None" ? t.split('|')[1] : ""));
                lbls_bl = d.pt_txts.map(t => (t.split('|')[2] !== "None" ? t.split('|')[2] : ""));
                lbls_br = d.pt_txts.map(t => (t.split('|')[3] !== "None" ? t.split('|')[3] : ""));
            } else {
                lbls = d.pt_txts;
            }
            
            const v_gr = document.getElementById("chk-inter").checked;
            const v_iso = document.getElementById("chk-iso").checked;
            const v_pt = is_synop ? true : document.getElementById("chk-pt").checked;
            const v_txt = is_synop ? true : document.getElementById("chk-txt").checked;
            const v_cbar = document.getElementById("chk-cbar") ? document.getElementById("chk-cbar").checked : true;
            
            const v_gr_f = is_synop ? false : v_gr;
            const v_iso_f = is_synop ? false : v_iso;
            
            const is_wind = (z_key === 'wiatr' || z_key === 'wiatr_sr');
            const pt_sym = null; 
            const pt_ang = 0;
            
            const op_gr = document.getElementById("sld-op-gr").value / 10.0;
            const op_pt = document.getElementById("sld-op-pt").value / 10.0;
            const sz_gr = parseInt(document.getElementById("sld-sz-gr").value);
            let sz_pt = parseInt(document.getElementById("sld-sz-pt").value);
            if (is_wind) sz_pt = sz_pt + 8; 
            
            const t2_mode = (v_txt && !is_synop) ? 'markers+text' : 'markers';
            
            const update = {
                'lat': [d.gr_lats, d.c_lats, d.pt_lats, [], d.w_lats, d.pt_lats, d.pt_lats, d.pt_lats, d.pt_lats],
                'lon': [d.gr_lons, d.c_lons, d.pt_lons, [], d.w_lons, d.pt_lons, d.pt_lons, d.pt_lons, d.pt_lons],
                'mode': ['markers', 'lines', t2_mode, 'markers', 'text', 'text', 'text', 'text', 'text'],
                'marker.color': [d.gr_vals, null, d.pt_vals, null, null, null, null, null, null],
                'marker.colorscale': [cscale, null, cscale, null, null, null, null, null, null],
                'marker.cmin': [zi.cmin, null, zi.cmin, null, null, null, null, null, null],
                'marker.cmax': [zi.cmax, null, zi.cmax, null, null, null, null, null, null],
                'marker.colorbar': [ (v_gr_f && v_cbar ? {title: zi.nazwa + " [" + zi.unit + "]", x: 1.02} : null), null, (v_pt && !is_synop && v_cbar ? {title: zi.nazwa + " [" + zi.unit + "]", x: 1.02} : null), null, null, null, null, null, null ],
                'marker.symbol': [null, null, pt_sym, null, null, null, null, null, null],
                'marker.angle': [null, null, pt_ang, null, null, null, null, null, null],
                'marker.size': [sz_gr, null, sz_pt, null, null, null, null, null, null],
                'marker.opacity': [op_gr, null, op_pt, null, null, null, null, null, null],
                'hovertext': [null, null, d.pt_hov, null, null, d.pt_hov, d.pt_hov, d.pt_hov, d.pt_hov],
                'text': [null, null, lbls, null, d.w_txts, lbls_tl, lbls_bl, lbls_tr, lbls_br],
                'visible': [v_gr_f, v_iso_f, v_pt, false, (is_wind && v_gr_f), (v_txt && is_synop), (v_txt && is_synop), (v_txt && is_synop), (v_txt && is_synop)]
            };
            
            Plotly.restyle('plot', update);
            
            document.getElementById('st-dane').innerText = d.pt_vals.length;
            if(d.pt_vals.length > 0) {
                const min = Math.min(...d.pt_vals).toFixed(1);
                const max = Math.max(...d.pt_vals).toFixed(1);
                document.getElementById('st-zakres').innerText = `${min} ${zi.unit} - ${max} ${zi.unit}`;
            } else {
                document.getElementById('st-zakres').innerText = "Brak danych";
            }
        }
        
        window.updateStyle = function() {
            const style = document.getElementById("sel-style").value;
            Plotly.relayout('plot', {'mapbox.style': style});
        }
        
        window.updateSliders = function() {
            const op_gr = document.getElementById("sld-op-gr").value;
            document.getElementById("val-op-gr").innerText = (op_gr * 10) + "%";
            const op_pt = document.getElementById("sld-op-pt").value;
            document.getElementById("val-op-pt").innerText = (op_pt * 10) + "%";
            const sz_gr = document.getElementById("sld-sz-gr").value;
            document.getElementById("val-sz-gr").innerText = sz_gr;
            const sz_pt = document.getElementById("sld-sz-pt").value;
            document.getElementById("val-sz-pt").innerText = sz_pt;
            window.updateMap();
        }

        window.toggleTopbar = function() {
            const topPanel = document.getElementById("top-panel-wrapper");
            const mapContainer = document.getElementById("main-map-container");
            const floatingBtn = document.getElementById("floating-show-topbar");
            if (topPanel.style.display === "none") {
                topPanel.style.display = "block";
                mapContainer.classList.remove("full-height");
                floatingBtn.style.display = "none";
            } else {
                topPanel.style.display = "none";
                mapContainer.classList.add("full-height");
                floatingBtn.style.display = "block";
            }
            window.dispatchEvent(new Event('resize'));
            if (window.Plotly) Plotly.Plots.resize('plot');
        };

        window.toggleSliders = function() {
            const panel = document.getElementById("sliders-panel");
            const icon = document.getElementById("sliders-toggle-icon");
            if (panel.classList.contains("collapsed")) {
                panel.classList.remove("collapsed");
                icon.innerText = "▲";
            } else {
                panel.classList.add("collapsed");
                icon.innerText = "▼";
            }
        };

        loadData();
    </script>
</body>
</html>
